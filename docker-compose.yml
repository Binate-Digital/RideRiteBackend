services:
  riderite-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: riderite-backend:latest
    container_name: riderite-backend
    restart: unless-stopped
    ports:
      - "3088:4000"
    volumes:
      # Host code bind-mount — keeps UAT code in sync with git pull
      - /home/ubuntu/projects/RideRiteBackend:/app
      # Named volume for node_modules (host OS ≠ container OS).
      # Entrypoint re-runs npm ci when packages like multer are missing.
      - riderite_node_modules:/app/node_modules
    environment:
      NODE_ENV: production
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    command: ["node", "src/server.js"]

volumes:
  riderite_node_modules:
