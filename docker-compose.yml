
services:
  riderite-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: riderite-backend:latest
    container_name: riderite-backend
    restart: unless-stopped
    ports:
      - "3088:4000"
    volumes:
      - /home/ubuntu/projects/RideRiteBackend:/app
      - riderite_node_modules:/app/node_modules
    environment:
      NODE_ENV: development

volumes:
  riderite_node_modules:
